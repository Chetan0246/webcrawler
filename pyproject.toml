[project]
name = "webcrawler"
version = "1.0.0"
description = "Async polite web crawler: BFS frontier, robots.txt, per-host rate limiting, SQLite index"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7.6",
]

[project.scripts]
webcrawler = "webcrawler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webcrawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S311"]  # asserts in tests; random for simulation/jitter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
"src/webcrawler/cli.py" = ["B008", "S608"]  # typer idiom; illustrative sqlite example string
